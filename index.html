<!DOCTYPE html>
<html>
<head>
    <title>Mashup Generator</title>
</head>
<body>
    <h2>Mashup Generator</h2>

    <form action="/create" method="post">
        <input type="text" name="singer" placeholder="Singer Name" required><br><br>
        <input type="number" name="videos" placeholder="Number of Videos (>10)" required><br><br>
        <input type="number" name="duration" placeholder="Duration (>20 sec)" required><br><br>
        <input type="email" name="email" placeholder="Email" required><br><br>
        <button type="submit">Create Mashup</button>
    </form>

</body>
</html>
